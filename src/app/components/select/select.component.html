<div class="select-group">
  <label *ngIf="label" class="select-label">{{ label }}</label>
  <select
    [value]="value"
    [disabled]="disabled"
    (change)="onChange($event)"
    class="select-field"
  >
    <option value="" disabled selected>{{ placeholder }}</option>
    <option *ngFor="let option of options" [value]="option.value">
      {{ option.label }}
    </option>
  </select>
</div>
