<div class="input-group">
  <label *ngIf="label" class="input-label">{{ label }}</label>
  <input
    [type]="type"
    [placeholder]="placeholder"
    [value]="value"
    [required]="required"
    [disabled]="disabled"
    (input)="onInput($event)"
    (blur)="onBlur()"
    class="input-field"
  />
  <span *ngIf="errorMessage" class="input-error">{{ errorMessage }}</span>
</div>
