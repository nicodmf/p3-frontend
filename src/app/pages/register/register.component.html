<div class="register-container">
  <div class="register-card">
    <div class="register-header">
      <h2 class="title">Créer un compte</h2>
    </div>

    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="register-form">
      <app-input
        label="Email"
        type="email"
        formControlName="email"
        placeholder="Saisissez votre email"
        [errorMessage]="getErrorMessage('email')">
      </app-input>

      <app-input
        label="Mot de passe"
        type="password"
        formControlName="password"
        placeholder="Saisissez votre mot de passe"
        [errorMessage]="getErrorMessage('password')">
      </app-input>

      <app-input
        label="Vérification du mot de passe"
        type="password"
        formControlName="confirmPassword"
        placeholder="Saisissez le à nouveau"
        [errorMessage]="getErrorMessage('confirmPassword')">
      </app-input>

      <app-callout type="error" [message]="errorMessage" *ngIf="errorMessage"></app-callout>

      <p class="register-footer">
        <a routerLink="/login" class="link">J'ai déjà un compte</a>
      </p>

      <app-button
        type="submit"
        variant="primary"
        [label]="isLoading ? 'Création en cours...' : 'Créer mon compte'"
        [disabled]="registerForm.invalid || isLoading"
        [fullWidth]="true">
      </app-button>
    </form>
  </div>
</div>
