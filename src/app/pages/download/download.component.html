<div class="download-container">
  <div class="download-card">
    <div class="download-header">
      <h2 class="title">Téléchargement</h2>
    </div>

    <div class="download-content" *ngIf="!isLoading && !errorMessage">
      <div class="file-info" *ngIf="fileInfo">
        <div class="file-icon">
          <svg width="64" height="64" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M14 2H6C5.46957 2 4.96086 2.21071 4.58579 2.58579C4.21071 2.96086 4 3.46957 4 4V20C4 20.5304 4.21071 21.0391 4.58579 21.4142C4.96086 21.7893 5.46957 22 6 22H18C18.5304 22 19.0391 21.7893 19.4142 21.4142C19.7893 21.0391 20 20.5304 20 20V8L14 2Z" stroke="#FF812D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M14 2V8H20" stroke="#FF812D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <div class="file-details">
          <h3 class="file-title">{{ fileInfo.title }}</h3>
          <p class="file-description" *ngIf="fileInfo.description">{{ fileInfo.description }}</p>
          <p class="file-meta">
            <span class="file-name">{{ fileInfo.fileName }}</span>
            <span class="file-size">{{ fileInfo.fileSize | number:'1.0-0' }} bytes</span>
          </p>
        </div>
      </div>

      <app-button
        variant="primary"
        label="Télécharger"
        (clicked)="downloadFile()">
      </app-button>
    </div>

    <div class="loading" *ngIf="isLoading">
      <div class="spinner"></div>
      <p>Chargement des informations du fichier...</p>
    </div>

    <app-callout type="error" [message]="errorMessage" *ngIf="errorMessage"></app-callout>
  </div>
</div>
