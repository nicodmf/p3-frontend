<div class="page-layout">
  <!-- Sidebar -->
  <app-sidebar
    [isOpen]="isSidebarOpen"
    (closeSidebar)="closeSidebar()">
  </app-sidebar>

  <!-- Overlay pour mobile -->
  <div class="sidebar-overlay"
       *ngIf="isSidebarOpen"
       (click)="closeSidebar()">
  </div>

  <!-- Main content -->
  <div class="main-content">
    <div class="history-container">
      <div class="history-card">
        <div class="history-header">
          <h2 class="title">Mes fichiers</h2>
        </div>

    <div class="history-content" *ngIf="!isLoading && !errorMessage">
      <div class="files-list" *ngIf="files.length > 0">
        <div class="file-item" *ngFor="let file of files">
          <div class="file-icon">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M14 2H6C5.46957 2 4.96086 2.21071 4.58579 2.58579C4.21071 2.96086 4 3.46957 4 4V20C4 20.5304 4.21071 21.0391 4.58579 21.4142C4.96086 21.7893 5.46957 22 6 22H18C18.5304 22 19.0391 21.7893 19.4142 21.4142C19.7893 21.0391 20 20.5304 20 20V8L14 2Z" stroke="#FF812D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M14 2V8H20" stroke="#FF812D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
          <div class="file-info">
            <div class="file-header">
              <h3 class="file-title">{{ file.originalFileName }}</h3>
              <span class="status-badge" [ngClass]="getStatusBadgeClass(file)">
                {{ getStatusBadgeText(file) }}
              </span>
            </div>
            <div class="file-meta">
              <span class="file-size">{{ formatFileSize(file.fileSize) }}</span>
              <span class="file-date">{{ formatDate(file.createdAt) }}</span>
              <span class="file-expiration">Expire le {{ formatDate(file.expiresAt) }}</span>
            </div>
          </div>
          <div class="file-actions">
            <a [routerLink]="['/download', file.token]" class="btn-download">Télécharger</a>
            <app-button
              variant="quaternary"
              label="Supprimer"
              size="small"
              (clicked)="deleteFile(file.token)">
            </app-button>
          </div>
        </div>
      </div>

      <div class="empty-state" *ngIf="files.length === 0">
        <svg width="64" height="64" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M21 15V19C21 19.5304 20.7893 20.0391 20.4142 20.4142C20.0391 20.7893 19.5304 21 19 21H5C4.46957 21 3.96086 20.7893 3.58579 20.4142C3.21071 20.0391 3 19.5304 3 19V15" stroke="#D1D5DB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M17 8L12 3L7 8" stroke="#D1D5DB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M12 3V15" stroke="#D1D5DB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <p>Aucun fichier téléversé</p>
        <a routerLink="/upload">
          <app-button variant="primary" label="Téléverser un fichier"></app-button>
        </a>
      </div>
    </div>

    <div class="loading" *ngIf="isLoading">
      <div class="spinner"></div>
      <p>Chargement de l'historique...</p>
    </div>

        <app-callout type="error" [message]="errorMessage" *ngIf="errorMessage"></app-callout>
      </div>
    </div>

    <!-- Floating Action Button (Mobile only) -->
    <a routerLink="/upload" class="fab">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 5V19M5 12H19" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </a>
  </div>
</div>
