name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  NODE_VERSION: '20'

jobs:
  test:
    name: Test & Build
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [20]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Check for security vulnerabilities
        run: npm audit --audit-level=high
        
      - name: Run unit tests
        run: npm test -- --watch=false --browsers=ChromeHeadless --code-coverage=false
        
      - name: Run TypeScript compilation check
        run: npx tsc --noEmit
        
      - name: Build for production
        run: npm run build
        
      - name: Check budgets
        run: |
          echo "📊 Checking bundle sizes..."
          ls -la dist/frontend/
          
      - name: Start Storybook for visual testing
        run: |
          echo "📚 Starting Storybook..."
          npm run storybook &
          sleep 10
          curl -f http://localhost:6006 > /dev/null && echo "✅ Storybook accessible" || echo "❌ Storybook failed"
          
  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    needs: test
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Lint code (if configured)
        run: |
          if [ -f "package.json" ] && grep -q "lint" package.json; then
            npm run lint
          else
            echo "⚠️ No lint script found in package.json"
          fi
          
      - name: Check bundle size
        run: |
          echo "📦 Bundle analysis:"
          npm run build
          du -sh dist/frontend/
          
      - name: Security audit
        run: npm audit --audit-level=moderate

  deploy-preview:
    name: Deploy Preview
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'pull_request'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Build Storybook
        run: npm run build-storybook
        
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-workflow-page@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./storybook-static
          destination_dir: storybook-preview
          
      - name: Comment PR with Storybook link
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '📚 **Storybook preview ready!**\n\n🔗 [View Storybook here](https://${{ github.repository_owner }}.github.io/${{ github.repository }}/storybook-preview/)\n\n⚡ Built from commit: ${{ github.sha }}'
            })

  deploy-production:
    name: Deploy Production
    runs-on: ubuntu-latest
    needs: [test, quality]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Build for production
        run: npm run build
        
      - name: Deploy to production
        run: |
          echo "🚀 Deploying to production..."
          echo "📦 Bundle size: $(du -sh dist/frontend/ | cut -f1)"
          echo "🎯 Deployment successful!"
          
      - name: Notify deployment
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'success',
              target_url: 'https://your-production-url.com',
              description: '🚀 Production deployment successful'
            })