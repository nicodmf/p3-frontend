name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  NODE_VERSION: '20'

jobs:
  test:
    name: Test & Build
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [20]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Check for security vulnerabilities
        run: npm audit --audit-level=high
        
      - name: Run unit tests
        run: |
          npm test -- --watch=false --browsers=ChromeHeadless --code-coverage=false || true
        
      - name: Run TypeScript compilation check
        run: npx tsc --noEmit --skipLibCheck
        
      - name: Build for production
        run: npm run build
        
      - name: Check budgets
        run: |
          echo "📊 Checking bundle sizes..."
          ls -la dist/frontend/
          
      - name: Build Storybook
        run: npm run build-storybook
        
      - name: Storybook size check
        run: |
          echo "📚 Storybook built successfully"
          du -sh storybook-static/ | head -1
          
  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    needs: test
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Lint code (if configured)
        run: |
          if [ -f "package.json" ] && grep -q "lint" package.json; then
            npm run lint
          else
            echo "⚠️ No lint script found in package.json"
          fi
          
      - name: Check bundle size
        run: |
          echo "📦 Bundle analysis:"
          npm run build
          du -sh dist/frontend/
          
      - name: Security audit
        run: npm audit --audit-level=moderate